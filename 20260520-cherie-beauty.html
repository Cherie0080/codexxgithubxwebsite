<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rich Cherie｜Cherie Beauty</title>
  <meta name="description" content="Cherie Beauty 公開頁：Reels、價目表、地圖。" />
  <meta property="og:title" content="Rich Cherie｜Cherie Beauty" />
  <meta property="og:description" content="Cherie Beauty 公開頁：Reels、價目表、地圖。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./assets/20260520-cherie-beauty/reels-thumb.jpg" />
  <style>
    :root{--bg:#fbf7f2;--panel:rgba(255,252,249,.92);--text:#433735;--muted:#7c6a68;--gold:#b7935f;--pink:#d8b7b3;--line:rgba(198,148,149,.22);--shadow:0 22px 56px rgba(67,55,53,.09);--brand-script:"Times New Roman","Georgia",serif}
    *{box-sizing:border-box} body{margin:0;font-family:"Noto Sans TC","PingFang TC",sans-serif;color:var(--text);background:radial-gradient(circle at top right, rgba(216,183,179,.22), transparent 30%),linear-gradient(180deg,#fffaf6 0%,#fbf7f2 100%);line-height:1.7}
    .wrap{width:min(1080px,calc(100vw - 24px));margin:18px auto 56px}
    .top-banner{display:block;text-align:center;padding:12px 16px;border-radius:999px;background:rgba(255,250,246,.8);border:1px solid var(--line);color:var(--gold);letter-spacing:.18em;font-family:var(--brand-script);font-size:.95rem;box-shadow:0 16px 40px rgba(67,55,53,.06)}
    .top-brand-card{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:24px 18px;box-shadow:var(--shadow);text-align:center}
    .top-brand-card h1{margin:0 0 10px;font-family:var(--brand-script);font-size:clamp(1.8rem,3.5vw,2.6rem);letter-spacing:.04em}
    .top-brand-card p{margin:6px 0;color:var(--muted);font-size:1rem}
    .brand-link{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;color:#b55f7b;font-weight:700;border-bottom:1px solid rgba(181,95,123,.35)}
    .section{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:24px 18px;box-shadow:var(--shadow)}
    h2{margin:0 0 14px;font-family:var(--brand-script);font-size:1.7rem;letter-spacing:.04em;text-align:center}
    .card-link{display:block}
    .hero-thumb,.price-card img,.map-card img{display:block;width:100%;height:auto;border-radius:20px}
    .hero-thumb{box-shadow:0 18px 42px rgba(67,55,53,.12)}
    .hint{margin:10px 0 0;text-align:center;color:var(--muted);font-size:.95rem}
    .price-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .price-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:12px}
    .price-card.wide{grid-column:1 / -1}
    .map-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:12px}
    .footer{margin-top:18px;text-align:center;color:#8d7d7b;font-size:.9rem}
    @media (max-width:800px){.price-grid{grid-template-columns:1fr}.price-card.wide{grid-column:auto}.wrap{width:calc(100vw - 16px);margin:12px auto 40px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top-banner">─── 𝓡𝓲𝓬𝓱 𝓒𝓱𝓮𝓻𝓲𝓮 ───</div>
    <div class="top-brand-card">
      <h1>鑫彤女王 𝔛𝔦𝔫𝔱𝔬𝔫𝔤 𝔔𝔲𝔢𝔢𝔫</h1>
      <p>房產投資／理財實戰／美業領航</p>
      <a class="brand-link" href="https://www.instagram.com/cherie.estilista" target="_blank" rel="noopener noreferrer">Instagram｜cherie.estilista</a>
    </div>

    <section class="section">
      <h2>Instagram Reels</h2>
      <a class="card-link" href="https://www.instagram.com/reel/DYhDn7ESBTR/?igsh=MXV5dm9jMWM1bTNiYg==" target="_blank" rel="noopener noreferrer">
        <img class="hero-thumb" src="./assets/20260520-cherie-beauty/reels-thumb.jpg" alt="Instagram Reels 縮圖" />
      </a>
      <p class="hint">直接點擊圖片即可前往影片</p>
    </section>

    <section class="section">
      <h2>價目表</h2>
      <div class="price-grid">
        <figure class="price-card"><img src="./assets/20260520-cherie-beauty/price-1.jpg" alt="Cherie Beauty 價目表 1" /></figure>
        <figure class="price-card"><img src="./assets/20260520-cherie-beauty/price-2.jpg" alt="Cherie Beauty 價目表 2" /></figure>
        <figure class="price-card wide"><img src="./assets/20260520-cherie-beauty/price-3.jpg" alt="Cherie Beauty 價目表 3" /></figure>
      </div>
    </section>

    <section class="section">
      <h2>地圖</h2>
      <figure class="map-card"><img src="./assets/20260520-cherie-beauty/map.jpg" alt="Cherie Beauty 地圖" /></figure>
    </section>

    <section class="section">
      <p style="margin:0;text-align:center;font-size:1.05rem;line-height:1.9;">
        寶們❤️<br />
        這個社群未來是我們的「秘密化妝間」<br />
        未來會分享很多關於彩妝、變美乾貨、女性理財資訊<br />
        點擊下方🔗加入吧！<br />
        <a class="brand-link" href="https://www.skool.com/estilista-make-up-3542/about?utm_campaign=skool_link_post&utm_content=f44efdf9d3aa48c8a21ea8ed23fe1044" target="_blank" rel="noopener noreferrer" style="margin-top:14px;">加入秘密化妝間</a>
      </p>
    </section>

    <div class="footer">© Rich Cherie</div>
  </main>
</body>
</html>
