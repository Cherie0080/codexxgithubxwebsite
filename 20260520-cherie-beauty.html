<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rich Cherie｜Cherie Beauty 形象頁</title>
  <meta name="description" content="Cherie Beauty 形象照片與 Instagram Reels 入口。" />
  <meta property="og:title" content="Rich Cherie｜Cherie Beauty 形象頁" />
  <meta property="og:description" content="形象照片展示＋Instagram Reels 連結。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./assets/20260520-cherie-beauty/main-photo.jpg" />
  <style>
    :root{--bg:#fbf7f2;--bg-soft:#f6ece7;--panel:rgba(255,252,249,.88);--panel-strong:rgba(255,248,245,.96);--text:#433735;--muted:#7c6a68;--gold:#b7935f;--pink:#d8b7b3;--pink-deep:#c69495;--line:rgba(198,148,149,.22);--shadow:0 24px 60px rgba(67,55,53,.09);--brand-script:"Times New Roman","Georgia",serif}
    *{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC",sans-serif;color:var(--text);background:radial-gradient(circle at top right, rgba(216,183,179,.28), transparent 30%),radial-gradient(circle at left 20% bottom 10%, rgba(243,231,226,.88), transparent 28%),linear-gradient(180deg,#fffaf6 0%,var(--bg) 42%,#f8f0ea 100%);line-height:1.7}a{text-decoration:none}.wrap{width:min(1080px,calc(100vw - 28px));margin:20px auto 70px}.top-banner{display:block;text-align:center;padding:12px 16px;border-radius:999px;background:rgba(255,250,246,.76);border:1px solid var(--line);color:var(--gold);letter-spacing:.18em;font-family:var(--brand-script);font-size:.95rem;box-shadow:0 16px 40px rgba(67,55,53,.06)}.hero{margin-top:18px;background:linear-gradient(140deg,rgba(255,252,249,.96),rgba(243,231,226,.90));border:1px solid var(--line);border-radius:38px;padding:44px 34px;box-shadow:var(--shadow)}.brand-card{background:rgba(255,255,255,.58);border:1px solid var(--line);border-radius:28px;padding:24px 22px;margin-bottom:24px}.brand-card h2{margin:0 0 10px;font-family:var(--brand-script);font-size:1.55rem;letter-spacing:.04em}.brand-card p{margin:6px 0;color:var(--muted)}.brand-card a{color:var(--pink-deep);border-bottom:1px solid rgba(198,148,149,.35)}.intro-photo{display:block;width:min(100%,420px);margin:18px auto 0;border-radius:22px;box-shadow:0 18px 42px rgba(67,55,53,.12)}.hero-grid{display:grid;grid-template-columns:1fr;gap:24px;align-items:center}h1{margin:0 0 12px;font-family:var(--brand-script);font-size:clamp(2.2rem,4vw,4rem);line-height:1.08;letter-spacing:.04em}.lead{margin:0;color:var(--muted);font-size:1.05rem}.section{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:32px;padding:30px 24px;box-shadow:var(--shadow)}.section h2{margin:0 0 14px;font-size:1.55rem}.photo-card{background:var(--panel-strong);border:1px solid var(--line);border-radius:26px;padding:14px;box-shadow:0 12px 28px rgba(67,55,53,.05)}.photo-card img{display:block;width:100%;height:auto;border-radius:18px}.photo-label{margin-top:10px;font-size:.92rem;color:var(--muted);text-align:center}.reel-card{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:center;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(243,231,226,.80));border:1px solid var(--line);border-radius:30px;padding:18px}.reel-card img{width:100%;display:block;border-radius:22px;box-shadow:0 14px 34px rgba(67,55,53,.12)}.eyebrow{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(216,183,179,.28);color:var(--pink-deep);font-size:.82rem;font-weight:700;margin-bottom:12px}.reel-card h3{margin:0 0 10px;font-size:1.5rem}.reel-card p{margin:0 0 16px;color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;font-weight:700;box-shadow:0 14px 30px rgba(198,148,149,.25)}.footer{margin-top:20px;text-align:center;color:#8d7d7b;font-size:.92rem}@media (max-width:900px){.hero-grid,.reel-card{grid-template-columns:1fr}.wrap{width:calc(100vw - 16px);margin:12px auto 40px}.hero,.section{padding:24px 18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top-banner">─── 𝓡𝓲𝓬𝓱 𝓒𝓱𝓮𝓻𝓲𝓮 ───</div>
    <section class="hero">
      <div class="brand-card">
        <h2>鑫彤女王 𝔛𝔦𝔫𝔱𝔬𝔫𝔤 𝔔𝔲𝔢𝔢𝔫</h2>
        <p>房產投資／理財實戰／美業領航</p>
        <p><a href="https://www.instagram.com/cherie.estilista" target="_blank" rel="noopener noreferrer">Instagram｜cherie.estilista</a></p>
        <img class="intro-photo" src="./assets/20260520-cherie-beauty/intro-photo.jpg" alt="Cherie Beauty 形象照片" />
      </div>
      <div class="hero-grid">
        <div>
          <h1>Cherie Beauty 形象頁</h1>
          <p class="lead">整理這次主視覺照片，並附上對應的 Instagram Reels 縮圖與超連結，方便直接公開分享。</p>
        </div>
      </div>
    </section>
    <section class="section">
      <h2>形象照片</h2>
      <figure class="photo-card">
        <img src="./assets/20260520-cherie-beauty/main-photo.jpg" alt="Cherie Beauty 形象照片" />
        <figcaption class="photo-label">Cherie Beauty</figcaption>
      </figure>
    </section>
    <section class="section">
      <h2>Instagram Reels</h2>
      <div class="reel-card">
        <div><img src="./assets/20260520-cherie-beauty/reel-cover.jpg" alt="Instagram Reels 縮圖" /></div>
        <div>
          <div class="eyebrow">Reels Link</div>
          <h3>打開 Reels 影片</h3>
          <p>點下面按鈕可直接開啟這支 Reels。</p>
          <a class="btn" href="https://www.instagram.com/reel/DYhDn7ESBTR/?igsh=MXV5dm9jMWM1bTNiYg==" target="_blank" rel="noopener noreferrer">前往觀看 Reels</a>
        </div>
      </div>
    </section>
    <div class="footer">© Rich Cherie</div>
  </main>
</body>
</html>
